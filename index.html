<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
 
<title>Portal Operacional de Frota</title>
 
<style>
 
body{
font-family: Arial, sans-serif;
background:#f4f6f8;
margin:0;
padding:20px;
}
 
.container{
max-width:800px;
margin:auto;
}
 
.header{
background:linear-gradient(135deg,#005A3C,#008B5E);
color:white;
padding:25px;
border-radius:12px;
text-align:center;
margin-bottom:20px;
}
 
.header h1{
margin:0;
}
 
.subtitulo{
margin-top:10px;
font-size:14px;
opacity:.9;
}
 
.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
}
 
.menu{
display:flex;
flex-direction:column;
gap:10px;
}
 
.menu button{
background:#005A3C;
color:white;
border:none;
padding:14px;
border-radius:10px;
font-size:15px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}
 
.menu button:hover{
background:#00724d;
}
 
.tituloConsulta{
margin-top:20px;
font-size:20px;
color:#005A3C;
}
 
input{
width:100%;
padding:12px;
margin-top:15px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:8px;
box-sizing:border-box;
}
 
#btnConsultar{
width:100%;
padding:14px;
background:#0f766e;
color:white;
border:none;
border-radius:10px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}
 
.resultado{
margin-top:20px;
background:white;
border-left:6px solid #005A3C;
border-radius:10px;
padding:20px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}
 
.footer{
margin-top:20px;
text-align:center;
font-size:12px;
color:#777;
}
 
</style>
 
</head>
 
<body>
 
<div class="container">
 
<div class="header">
 
<h1>🚛 Portal Operacional de Frota</h1>
 
<div class="subtitulo">
Consulta de Status, Programação de Paradas e Posicionamento da Frota
</div>
 
</div>
 
<div class="card">
 
<div class="menu">
 
<button onclick="selecionarModo('status')">
🚛 Status de Carretas
</button>
 
<button onclick="selecionarModo('parada')">
🔧 Programação de Parada
</button>
 
<button onclick="selecionarModo('frota')">
📍 Programação da Frota
</button>
 
</div>
 
<h2 class="tituloConsulta" id="tituloConsulta">
Selecione uma consulta
</h2>
 
<input
type="number"
id="codigo"
placeholder="Digite um código">
 
<button id="btnConsultar" onclick="consultar()">
CONSULTAR
</button>
 
<div class="resultado" id="resultado">
Aguardando consulta...
</div>
 
</div>
 
<div class="footer">
Dados atualizados automaticamente a partir da base operacional do CCO.
</div>
 
</div>
 
<script>
 
const URL_STATUS =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTj-gn9U3QR5fINjXm3mJEUHbCiqGNyqlGqXZK1dgQbZBOE6FCEh754sGf1hvQk59uUrhaKWQWUt7I1/pub?gid=0&single=true&output=csv";
 
const URL_PARADA =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTj-gn9U3QR5fINjXm3mJEUHbCiqGNyqlGqXZK1dgQbZBOE6FCEh754sGf1hvQk59uUrhaKWQWUt7I1/pub?gid=1043445685&single=true&output=csv";
 
const URL_FROTA =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTj-gn9U3QR5fINjXm3mJEUHbCiqGNyqlGqXZK1dgQbZBOE6FCEh754sGf1hvQk59uUrhaKWQWUt7I1/pub?gid=177734172&single=true&output=csv";
 
let modoAtual = "";
 
function selecionarModo(modo){
 
modoAtual = modo;
 
const titulo =
document.getElementById("tituloConsulta");
 
const campo =
document.getElementById("codigo");
 
if(modo === "status"){
 
titulo.innerText =
"🚛 Consulta Status de Carretas";
 
campo.placeholder =
"Digite o GO da Carreta";
 
}
 
if(modo === "parada"){
 
titulo.innerText =
"🔧 Consulta Programação de Parada";
 
campo.placeholder =
"Digite o GO da Carreta";
 
}
 
if(modo === "frota"){
 
titulo.innerText =
"📍 Consulta Programação da Frota";
 
campo.placeholder =
"Digite o GO do Cavalo Mecânico";
 
}
 
}
 
async function carregarCSV(url){
 
const resposta = await fetch(
url + "&t=" + new Date().getTime()
);
 
const texto = await resposta.text();
 
return texto.trim().split("\n");
 
}
 
async function consultar(){
 
if(modoAtual === ""){
 
alert("Selecione uma consulta.");
 
return;
 
}
 
const valor =
document.getElementById("codigo").value;
 
const resultado =
document.getElementById("resultado");
 
if(modoAtual === "status"){
 
const linhas =
await carregarCSV(URL_STATUS);
 
for(let i=1;i<linhas.length;i++){
 
const c =
linhas[i].split(",");
 
if(c[0] == valor){
 
resultado.innerHTML = `
<b>GO CARRETA:</b> ${c[0]}<br><br>
<b>STATUS:</b> ${c[1]}<br><br>
<b>ATIVIDADE:</b> ${c[2]}<br><br>
<b>GO CAVALO MECÂNICO:</b> ${c[3]}
`;
 
return;
}
 
}
 
}
 
if(modoAtual === "parada"){
 
const linhas =
await carregarCSV(URL_PARADA);
 
for(let i=1;i<linhas.length;i++){
 
const c =
linhas[i].split(",");
 
if(c[0] == valor){
 
resultado.innerHTML = `
<b>GO CARRETA:</b> ${c[0]}<br><br>
<b>TIPO DE PARADA:</b> ${c[1]}<br><br>
<b>DIA APROXIMADO:</b> ${c[2]}
`;
 
return;
}
 
}
 
}
 
if(modoAtual === "frota"){
 
const linhas =
await carregarCSV(URL_FROTA);
 
for(let i=1;i<linhas.length;i++){
 
const c =
linhas[i].split(",");
 
if(c[0] == valor){
 
resultado.innerHTML = `
<b>GO CAVALO:</b> ${c[0]}<br><br>
<b>FRENTE DE CARREGAMENTO:</b> ${c[1]}<br><br>
<b>LOCALIZAÇÃO:</b> ${c[2]}
`;
 
return;
}
 
}
 
}
 
resultado.innerHTML =
"⚠️ Registro não encontrado.";
 
}
 
</script>
 
</body>
</html>
