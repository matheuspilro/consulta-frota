<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal Operacional de Frota</title>

    <style>

        /* ==========================================
           CONFIGURAÇÕES GERAIS
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f3f6f4;
            color: #24332d;
            padding: 25px;
        }

        .container {
            max-width: 950px;
            margin: auto;
        }


        /* ==========================================
           CABEÇALHO
        ========================================== */

        .header {
            background: linear-gradient(
                135deg,
                #004d36 0%,
                #006b4f 55%,
                #00845f 100%
            );

            color: white;

            padding: 38px 35px;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 77, 54, 0.20);

            margin-bottom: 22px;

            position: relative;
            overflow: hidden;
        }

        .header::after {
            content: "";
            position: absolute;

            width: 180px;
            height: 180px;

            background: rgba(255, 255, 255, 0.05);

            border-radius: 50%;

            right: -60px;
            top: -70px;
        }

        .header h1 {
            font-size: 31px;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 15px;
            opacity: 0.92;
            position: relative;
            z-index: 1;
        }


        /* ==========================================
           CARD PRINCIPAL
        ========================================== */

        .card {
            background: white;

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);

            border: 1px solid #e5ebe8;
        }


        /* ==========================================
           TÍTULO DA CONSULTA
        ========================================== */

        .titulo-consulta {
            color: #005a3c;

            font-size: 23px;

            font-weight: 700;

            margin-bottom: 18px;
        }

        .subtitulo {
            color: #6b7772;

            font-size: 14px;

            margin-top: -10px;

            margin-bottom: 22px;
        }


        /* ==========================================
           MENU
        ========================================== */

        .menu {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 14px;
        }

        .menu button {

            border: 1px solid #d9e5df;

            background: #f8faf9;

            color: #005a3c;

            padding: 18px 14px;

            border-radius: 13px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                box-shadow 0.15s ease;

        }

        .menu button:hover {

            background: #eaf4ef;

            transform: translateY(-2px);

            box-shadow:
                0 5px 12px rgba(0, 90, 60, 0.10);

        }

        .menu button:active {

            transform: translateY(0);

        }


        /* ==========================================
           CAMPO DE CONSULTA
        ========================================== */

        .campo-area {
            margin-top: 28px;

            padding-top: 25px;

            border-top: 1px solid #e7ece9;
        }

        .campo-label {

            display: block;

            font-size: 13px;

            font-weight: 600;

            color: #4d5a54;

            margin-bottom: 8px;

        }

        input {

            width: 100%;

            padding: 15px 16px;

            border: 1px solid #d4ddd8;

            border-radius: 10px;

            font-size: 16px;

            color: #24332d;

            outline: none;

            transition:
                border 0.2s ease,
                box-shadow 0.2s ease;

        }

        input:focus {

            border-color: #0a8a5e;

            box-shadow:
                0 0 0 3px rgba(10, 138, 94, 0.12);

        }


        /* ==========================================
           BOTÃO CONSULTAR
        ========================================== */

        #btnConsultar {

            width: 100%;

            margin-top: 12px;

            background: #0a8a5e;

            color: white;

            border: none;

            padding: 16px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.15s ease;

        }

        #btnConsultar:hover {

            background: #08714d;

            transform: translateY(-1px);

        }

        #btnConsultar:active {

            transform: translateY(0);

        }


        /* ==========================================
           RESULTADO
        ========================================== */

        .resultado {

            margin-top: 22px;

            background: #f7faf8;

            border: 1px solid #e1ebe6;

            border-left: 5px solid #0a8a5e;

            border-radius: 12px;

            padding: 20px;

            min-height: 90px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.04);

            line-height: 1.8;

            color: #35433d;

        }


        /* ==========================================
           RODAPÉ
        ========================================== */

        .footer {

            text-align: center;

            margin-top: 18px;

            font-size: 12px;

            color: #78837e;

        }


        /* ==========================================
           CELULAR
        ========================================== */

        @media (max-width: 700px) {

            body {

                padding: 12px;

            }

            .header {

                padding: 30px 20px;

                border-radius: 15px;

            }

            .header h1 {

                font-size: 24px;

            }

            .header p {

                font-size: 13px;

                line-height: 1.5;

            }

            .card {

                padding: 20px;

                border-radius: 15px;

            }

            .titulo-consulta {

                font-size: 21px;

            }

            .menu {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>

    <div class="container">


        <!-- ==========================================
             CABEÇALHO
        ========================================== -->

        <div class="header">

            <h1>🚛 Portal Operacional de Frota</h1>

            <p>
                Consulta de status, programação de paradas
                e posicionamento da frota
            </p>

        </div>


        <!-- ==========================================
             ÁREA PRINCIPAL
        ========================================== -->

        <div class="card">


            <!-- TÍTULO -->

            <h2 class="titulo-consulta" id="tituloConsulta">

                Selecione uma consulta

            </h2>

            <p class="subtitulo">

                Escolha uma das opções abaixo para consultar
                as informações operacionais.

            </p>


            <!-- MENU -->

            <div class="menu">

                <button onclick="selecionarModo('status')">

                    🚛<br>
                    Status de Carretas

                </button>


                <button onclick="selecionarModo('parada')">

                    🔧<br>
                    Programação de Parada

                </button>


                <button onclick="selecionarModo('frota')">

                    📍<br>
                    Programação da Frota

                </button>

            </div>


            <!-- CAMPO -->

            <div class="campo-area">

                <label
                    class="campo-label"
                    for="codigo">

                    Código para consulta

                </label>


                <input
                    type="number"
                    id="codigo"
                    placeholder="Selecione uma consulta acima"
                >


                <button
                    id="btnConsultar"
                    onclick="consultar()">

                    CONSULTAR

                </button>

            </div>


            <!-- RESULTADO -->

            <div
                class="resultado"
                id="resultado">

                Aguardando consulta...

            </div>


        </div>


        <!-- ==========================================
             RODAPÉ
        ========================================== -->

        <div class="footer">

            Dados atualizados automaticamente a partir
            da base operacional do CCO

        </div>


    </div>


    <script>


        /* ==========================================
           LINKS DAS PLANILHAS
        ========================================== */

        const URL_STATUS =
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTj-gn9U3QR5fINjXm3mJEUHbCiqGNyqlGqXZK1dgQbZBOE6FCEh754sGf1hvQk59uUrhaKWQWUt7I1/pub?gid=0&single=true&output=csv";


        const URL_PARADA =
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTj-gn9U3QR5fINjXm3mJEUHbCiqGNyqlGqXZK1dgQbZBOE6FCEh754sGf1hvQk59uUrhaKWQWUt7I1/pub?gid=1043445685&single=true&output=csv";


        const URL_FROTA =
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vTj-gn9U3QR5fINjXm3mJEUHbCiqGNyqlGqXZK1dgQbZBOE6FCEh754sGf1hvQk59uUrhaKWQWUt7I1/pub?gid=177734172&single=true&output=csv";


        let modoAtual = "";


        /* ==========================================
           SELECIONAR MODO
        ========================================== */

        function selecionarModo(modo) {

            modoAtual = modo;

            const titulo =
                document.getElementById(
                    "tituloConsulta"
                );

            const campo =
                document.getElementById(
                    "codigo"
                );

            const resultado =
                document.getElementById(
                    "resultado"
                );


            resultado.innerHTML =
                "Aguardando consulta...";


            if (modo === "status") {

                titulo.innerText =
                    "🚛 Consulta Status de Carretas";

                campo.placeholder =
                    "Digite o GO da Carreta";

            }


            if (modo === "parada") {

                titulo.innerText =
                    "🔧 Consulta Programação de Parada";

                campo.placeholder =
                    "Digite o GO da Carreta";

            }


            if (modo === "frota") {

                titulo.innerText =
                    "📍 Consulta Programação da Frota";

                campo.placeholder =
                    "Digite o GO do Cavalo Mecânico";

            }

        }


        /* ==========================================
           CARREGAR CSV
        ========================================== */

        async function carregarCSV(url) {

            const resposta =
                await fetch(
                    url +
                    "&t=" +
                    new Date().getTime()
                );


            if (!resposta.ok) {

                throw new Error(
                    "Não foi possível acessar a planilha."
                );

            }


            const texto =
                await resposta.text();


            return texto
                .trim()
                .split("\n");

        }


        /* ==========================================
           CONSULTAR
        ========================================== */

        async function consultar() {


            if (modoAtual === "") {

                alert(
                    "Selecione uma consulta."
                );

                return;

            }


            const valor =
                document
                    .getElementById("codigo")
                    .value
                    .trim();


            const resultado =
                document.getElementById(
                    "resultado"
                );


            if (valor === "") {

                resultado.innerHTML =
                    "⚠️ Digite um código para realizar a consulta.";

                return;

            }


            resultado.innerHTML =
                "🔄 Consultando dados...";


            try {


                /* ==========================================
                   STATUS
                ========================================== */

                if (modoAtual === "status") {

                    const linhas =
                        await carregarCSV(
                            URL_STATUS
                        );


                    for (
                        let i = 1;
                        i < linhas.length;
                        i++
                    ) {

                        const c =
                            linhas[i].split(",");


                        if (
                            c[0].trim() == valor
                        ) {

                            resultado.innerHTML = `

                                <b>GO CARRETA:</b>
                                ${c[0]}<br>

                                <b>STATUS:</b>
                                ${c[1]}<br>

                                <b>ATIVIDADE:</b>
                                ${c[2]}<br>

                                <b>GO CAVALO:</b>
                                ${c[3]}

                            `;

                            return;

                        }

                    }

                }


                /* ==========================================
                   PARADA
                ========================================== */

                if (modoAtual === "parada") {

                    const linhas =
                        await carregarCSV(
                            URL_PARADA
                        );


                    for (
                        let i = 1;
                        i < linhas.length;
                        i++
                    ) {

                        const c =
                            linhas[i].split(",");


                        if (
                            c[0].trim() == valor
                        ) {

                            resultado.innerHTML = `

                                <b>GO CARRETA:</b>
                                ${c[0]}<br>

                                <b>TIPO PARADA:</b>
                                ${c[1]}<br>

                                <b>DIA APROXIMADO:</b>
                                ${c[2]}

                            `;

                            return;

                        }

                    }

                }


                /* ==========================================
                   FROTA
                ========================================== */

                if (modoAtual === "frota") {

                    const linhas =
                        await carregarCSV(
                            URL_FROTA
                        );


                    for (
                        let i = 1;
                        i < linhas.length;
                        i++
                    ) {

                        const c =
                            linhas[i].split(",");


                        if (
                            c[0].trim() == valor
                        ) {

                            resultado.innerHTML = `

                                <b>GO CAVALO:</b>
                                ${c[0]}<br>

                                <b>FRENTE:</b>
                                ${c[1]}<br>

                                <b>LOCALIZAÇÃO:</b>
                                ${c[2]}

                            `;

                            return;

                        }

                    }

                }


                resultado.innerHTML =
                    "⚠️ Registro não encontrado.";


            } catch (erro) {

                console.error(erro);

                resultado.innerHTML =
                    "❌ Erro ao consultar os dados. Verifique se a planilha está publicada corretamente.";

            }

        }

    </script>

</body>

</html>
