<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>Portal Operacional de Frota</title>
 
<style>

body {
    background: black;
}

.header {
    background: red;
    color: white;
}

.card {
    background: blue;
}

</style>
  
</head>
 
<body>
 
<div class="container">
 
<div class="header">
<h1>🚛 Portal Operacional de Frota</h1>
<p>
Consulta de Status, Programação de Paradas
e Posicionamento da Frota
</p>
</div>
 
<div class="card">
 
<div class="menu">
 
<button onclick="selecionarModo('status')">
🚛 Status de Carretas
</button>
 
<button onclick="selecionarModo('parada')">
🔧 Programação de Parada
</button>
 
<button onclick="selecionarModo('frota')">
📍 Programação da Frota
</button>
 
</div>
 
<h2 class="titulo-consulta" id="tituloConsulta">
Selecione uma consulta
</h2>
 
<input
type="number"
id="codigo"
placeholder="Digite um código">
 
<button id="btnConsultar" onclick="consultar()">
CONSULTAR
</button>
 
<div class="resultado" id="resultado">
Aguardando consulta...
</div>
 
</div>
 
<div class="footer">
Dados atualizados automaticamente a partir da base operacional do CCO
</div>
 
</div>
 
<script>
 
const URL_STATUS =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTj-gn9U3QR5fINjXm3mJEUHbCiqGNyqlGqXZK1dgQbZBOE6FCEh754sGf1hvQk59uUrhaKWQWUt7I1/pub?gid=0&single=true&output=csv";
 
const URL_PARADA =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTj-gn9U3QR5fINjXm3mJEUHbCiqGNyqlGqXZK1dgQbZBOE6FCEh754sGf1hvQk59uUrhaKWQWUt7I1/pub?gid=1043445685&single=true&output=csv";
 
const URL_FROTA =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTj-gn9U3QR5fINjXm3mJEUHbCiqGNyqlGqXZK1dgQbZBOE6FCEh754sGf1hvQk59uUrhaKWQWUt7I1/pub?gid=177734172&single=true&output=csv";
 
let modoAtual = "";
 
function selecionarModo(modo){
 
modoAtual = modo;
 
const titulo =
document.getElementById("tituloConsulta");
 
const campo =
document.getElementById("codigo");
 
document.getElementById("resultado").innerHTML =
"Aguardando consulta...";
 
if(modo === "status"){
 
titulo.innerText =
"🚛 Consulta Status de Carretas";
 
campo.placeholder =
"Digite o GO da Carreta";
 
}
 
if(modo === "parada"){
 
titulo.innerText =
"🔧 Consulta Programação de Parada";
 
campo.placeholder =
"Digite o GO da Carreta";
 
}
 
if(modo === "frota"){
 
titulo.innerText =
"📍 Consulta Programação da Frota";
 
campo.placeholder =
"Digite o GO do Cavalo Mecânico";
 
}
 
}
 
async function carregarCSV(url){
 
const resposta =
await fetch(
url + "&t=" + new Date().getTime()
);
 
const texto =
await resposta.text();
 
return texto.trim().split("\n");
 
}
 
async function consultar(){
 
if(modoAtual === ""){
 
alert("Selecione uma consulta.");
 
return;
 
}
 
const valor =
document.getElementById("codigo").value;
 
const resultado =
document.getElementById("resultado");
 
if(modoAtual === "status"){
 
const linhas =
await carregarCSV(URL_STATUS);
 
for(let i=1;i<linhas.length;i++){
 
const c =
linhas[i].split(",");
 
if(c[0] == valor){
 
resultado.innerHTML =
`<b>GO CARRETA:</b> ${c[0]}<br>
<b>STATUS:</b> ${c[1]}<br>
<b>ATIVIDADE:</b> ${c[2]}<br>
<b>GO CAVALO:</b> ${c[3]}`;
 
return;
 
}
 
}
 
}
 
if(modoAtual === "parada"){
 
const linhas =
await carregarCSV(URL_PARADA);
 
for(let i=1;i<linhas.length;i++){
 
const c =
linhas[i].split(",");
 
if(c[0] == valor){
 
resultado.innerHTML =
`<b>GO CARRETA:</b> ${c[0]}<br>
<b>TIPO PARADA:</b> ${c[1]}<br>
<b>DIA APROXIMADO:</b> ${c[2]}`;
 
return;
 
}
 
}
 
}
 
if(modoAtual === "frota"){
 
const linhas =
await carregarCSV(URL_FROTA);
 
for(let i=1;i<linhas.length;i++){
 
const c =
linhas[i].split(",");
 
if(c[0] == valor){
 
resultado.innerHTML =
`<b>GO CAVALO:</b> ${c[0]}<br>
<b>FRENTE:</b> ${c[1]}<br>
<b>LOCALIZAÇÃO:</b> ${c[2]}`;
 
return;
 
}
 
}
 
}
 
resultado.innerHTML =
"⚠️ Registro não encontrado.";
 
}
 
</script>
 
</body>
</html>
