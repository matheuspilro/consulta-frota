<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Operacional de Frota</title>
 
<style>
 
body{
font-family: Arial, sans-serif;
background:#f4f6f8;
max-width:700px;
margin:auto;
padding:20px;
}
 
.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}
 
h1{
color:#005A3C;
text-align:center;
}
 
.menu{
display:flex;
flex-direction:column;
gap:10px;
margin-bottom:20px;
}
 
.menu button{
background:#005A3C;
color:white;
border:none;
padding:14px;
border-radius:8px;
cursor:pointer;
}
 
input{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:10px;
box-sizing:border-box;
}
 
#btnConsultar{
width:100%;
background:#0f766e;
color:white;
border:none;
padding:12px;
border-radius:8px;
cursor:pointer;
}
 
.resultado{
margin-top:20px;
padding:15px;
background:#eef7f3;
border-radius:8px;
}
 
</style>
 
</head>
 
<body>
 
<div class="card">
 
<h1>🚛 Portal Operacional de Frota</h1>
 
<div class="menu">
 
<button onclick="selecionarModo('status')">
🚛 Status de Carretas
</button>
 
<button onclick="selecionarModo('parada')">
🔧 Programação de Parada
</button>
 
<button onclick="selecionarModo('frota')">
📍 Programação da Frota
</button>
 
</div>
 
<h3 id="tituloConsulta">
Selecione uma consulta acima
</h3>
 
<input
type="number"
id="codigo"
placeholder="Digite o código"
>
 
<button id="btnConsultar" onclick="consultar()">
Consultar
</button>
 
<div class="resultado" id="resultado">
Aguardando consulta...
</div>
 
</div>
 
<script>
 
const URL_STATUS =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTj-gn9U3QR5fINjXm3mJEUHbCiqGNyqlGqXZK1dgQbZBOE6FCEh754sGf1hvQk59uUrhaKWQWUt7I1/pub?gid=0&single=true&output=csv";
 
const URL_PARADA =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTj-gn9U3QR5fINjXm3mJEUHbCiqGNyqlGqXZK1dgQbZBOE6FCEh754sGf1hvQk59uUrhaKWQWUt7I1/pub?gid=1043445685&single=true&output=csv";
 
const URL_FROTA =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTj-gn9U3QR5fINjXm3mJEUHbCiqGNyqlGqXZK1dgQbZBOE6FCEh754sGf1hvQk59uUrhaKWQWUt7I1/pub?gid=177734172&single=true&output=csv";
 
let modoAtual = "";
 
function selecionarModo(modo){
 
modoAtual = modo;
 
const titulo =
document.getElementById("tituloConsulta");
 
const campo =
document.getElementById("codigo");
 
if(modo === "status"){
 
titulo.innerHTML =
"🚛 Consulta Status de Carretas";
 
campo.placeholder =
"Digite o GO da Carreta";
 
}
 
if(modo === "parada"){
 
titulo.innerHTML =
"🔧 Consulta Programação de Parada";
 
campo.placeholder =
"Digite o GO da Carreta";
 
}
 
if(modo === "frota"){
 
titulo.innerHTML =
"📍 Consulta Programação da Frota";
 
campo.placeholder =
"Digite o GO do Cavalo Mecânico";
 
}
 
}
 
async function carregarCSV(url){
 
const resposta =
await fetch(
url + "&t=" + new Date().getTime()
);
 
const texto =
await resposta.text();
 
return texto.trim().split("\n");
 
}
 
async function consultar(){
 
if(modoAtual === ""){
 
alert(
"Selecione uma consulta."
);
 
return;
 
}
 
const valor =
document.getElementById("codigo").value;
 
const resultado =
document.getElementById("resultado");
 
if(modoAtual === "status"){
 
const linhas =
await carregarCSV(URL_STATUS);
 
for(let i=1;i<linhas.length;i++){
 
const c =
linhas[i].split(",");
 
if(c[0] == valor){
 
resultado.innerHTML = `
<b>GO CARRETA:</b> ${c[0]}<br><br>
 
<b>STATUS:</b> ${c[1]}<br><br>
 
<b>ATIVIDADE:</b> ${c[2]}<br><br>
 
<b>GO CAVALO MECÂNICO:</b> ${c[3]}
`;
 
return;
}
 
}
 
}
 
if(modoAtual === "parada"){
 
const linhas =
await carregarCSV(URL_PARADA);
 
for(let i=1;i<linhas.length;i++){
 
const c =
linhas[i].split(",");
 
if(c[0] == valor){
 
resultado.innerHTML = `
<b>GO CARRETA:</b> ${c[0]}<br><br>
 
<b>TIPO DE PARADA:</b> ${c[1]}<br><br>
 
<b>DIA APROXIMADO:</b> ${c[2]}
`;
 
return;
}
 
}
 
}
 
if(modoAtual === "frota"){
 
const linhas =
await carregarCSV(URL_FROTA);
 
for(let i=1;i<linhas.length;i++){
 
const c =
linhas[i].split(",");
 
if(c[0] == valor){
 
resultado.innerHTML = `
<b>GO CAVALO:</b> ${c[0]}<br><br>
 
<b>FRENTE:</b> ${c[1]}<br><br>
 
<b>LOCALIZAÇÃO:</b> ${c[2]}
`;
 
return;
}
 
}
 
}
 
resultado.innerHTML =
"⚠️ Registro não encontrado.";
 
}
 
</script>
 
</body>
</html>
